[package]
name = "xtask"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Preflight helpers for the workspace: crate layering and the Windows cross-build"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
voxel-core = { path = "../crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
