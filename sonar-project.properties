sonar.projectKey=jsperry0807-rgb_voxel-engine
sonar.organization=jsperry0807-rgb
sonar.projectName=voxel-engine
sonar.sourceEncoding=UTF-8

# Rust sources. The vendored `crates/ECS` snapshot is not a workspace member and
# is not compiled by the engine, so it is kept out of the analysis.
sonar.sources=crates,apps,xtask,benchmarks
sonar.exclusions=target/**,site/**,crates/ECS/**

# Generated and vendored material is not authored here.
sonar.cpd.exclusions=**/fixture/*.ron,**/tests/**

# Wait for the server-side report to be processed so a failure or a failing
# quality gate is reported by the job that produced it.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600
