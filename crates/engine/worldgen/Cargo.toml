[package]
name = "voxel-worldgen"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Deterministic terrain world generation for the voxel engine"

[dependencies]
voxel-core = { path = "../../core" }
serde = { version = "1", features = ["derive"] }
ron = "0.8"

[features]
# Forward the pre-registered 128³ chunk edge to `voxel-core`.
chunk128 = ["voxel-core/chunk128"]

[dev-dependencies]
# The terrain preview example renders the macro map to a PNG.
png = "=0.17.16"
# Biome content is validated against the committed block manifest.
voxel-block = { path = "../block" }
