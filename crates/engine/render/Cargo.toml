[package]
name = "voxel-render"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
voxel-block = { path = "../block" }
voxel-storage = { path = "../storage" }
wgpu = "30"
bytemuck = "1"

[features]
# Forward the pre-registered 128³ chunk edge to `voxel-storage` (and thus
# `voxel-core`). The shader's edge-dependent constants are selected here.
chunk128 = ["voxel-storage/chunk128"]

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }
pollster = "1"
