[package]
name = "voxel-viewer"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
blake3 = "1"
bytemuck = { version = "1", features = ["derive"] }
env_logger = "0.11"
glam = "0.29"
log = "0.4"
png = "0.17"
pollster = "1"
ron = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
voxel-app-support = { path = "../../app-support" }
voxel-core = { path = "../../core" }
voxel-mesh = { path = "../mesh" }
voxel-storage = { path = "../storage" }
voxel-texgraph = { path = "../texgraph" }
wgpu = "30"
winit = "0.30"

[features]
# Forward the pre-registered 128³ chunk edge to the content crates.
chunk128 = ["voxel-core/chunk128", "voxel-storage/chunk128", "voxel-mesh/chunk128"]

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }

[[example]]
name = "quad_spike"
required-features = ["chunk128"]

[[example]]
name = "gate_c"
required-features = ["chunk128"]
