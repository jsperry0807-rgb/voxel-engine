[package]
name = "voxel-viewer"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
blake3 = "1"
bytemuck = { version = "1", features = ["derive"] }
env_logger = "0.11"
glam = "0.29"
log = "0.4"
png = "0.17"
pollster = "1"
ron = "0.8"
serde = { version = "1", features = ["derive"] }
voxel-core = { path = "../../core" }
wgpu = "30"
winit = "0.30"
