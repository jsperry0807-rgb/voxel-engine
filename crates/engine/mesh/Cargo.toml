[package]
name = "voxel-mesh"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Block-granular content pipeline for the voxel engine"

[dependencies]
voxel-core = { path = "../../core" }
voxel-storage = { path = "../storage" }

[dev-dependencies]
criterion = "0.5"

# `pprof` is Unix-only (it uses `nix`/`libc` unconditionally), so keeping it as
# a plain dev-dependency made every Windows test target uncompilable.
[target.'cfg(unix)'.dev-dependencies]
pprof = { version = "0.15.0", features = ["flamegraph", "criterion"] }

[features]
# Forward the pre-registered 128³ chunk edge to the storage crate.
chunk128 = ["voxel-storage/chunk128"]
# Optional SVDAG ray-test occluder (M2-25), off by default (ADR-006).
raytest = []

[[bench]]
name = "light"
harness = false

[[bench]]
name = "probe"
harness = false

[[test]]
name = "raytest"
required-features = ["raytest"]

[[test]]
name = "raytest_compare"
required-features = ["raytest"]
