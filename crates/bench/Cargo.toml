[package]
name = "voxel-bench"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
voxel-block = { path = "../engine/block" }
voxel-viewer = { path = "../engine/viewer" }
voxel-core = { path = "../core" }
voxel-profiling = { path = "../profiling" }
voxel-storage = { path = "../engine/storage" }
voxel-mesh = { path = "../engine/mesh" }
blake3 = "1"
libc = "0.2"
png = "0.17"
pollster = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "30"

[dev-dependencies]
criterion = "0.5"
voxel-render = { path = "../engine/render" }
iai-callgrind = "0.16"

[features]
# Forward the pre-registered 128³ chunk edge to the crates this benchmark
# drives.
chunk128 = [
    "voxel-storage/chunk128",
    "voxel-mesh/chunk128",
    "voxel-render/chunk128",
    "voxel-viewer/chunk128",
]
# Gates the iai-callgrind bench target; the dependency itself is a dev-dep.
iai = []

[[bench]]
name = "block"
harness = false

[[bench]]
name = "render"
harness = false

[[bench]]
name = "iai"
harness = false
required-features = ["iai"]
