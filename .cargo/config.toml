# Cargo cannot shadow built-in commands, so `cargo build` stays the plain
# Linux build that CI and the tests use. These aliases are the shortcuts the
# launcher also exposes in its window.

[alias]
launcher = "run -p voxel-launcher"
xtask = "run --quiet -p xtask --"
# Routed through xtask so the mingw-w64 / target preflight runs first and can
# install missing pieces on demand. Plain `build` remains the Linux build.
build-win = "run --quiet -p xtask -- build-win"
setup-win = "run --quiet -p xtask -- doctor --install"
