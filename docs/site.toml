# Documentation site taxonomy.
#
# Every Markdown file in the repository is published. This file decides where
# it appears in the navigation and on the landing page. It is deliberately
# curated: the order below is the reading order, and only files listed here (or
# matched by a glob) move out of the fallback "Other" section.
#
#   pages      explicit, ordered repository-relative paths
#   match      shell-style globs, appended after `pages` in numeric order
#   group_by   "directory" nests the matched pages under their parent directory
#              (used for benchmark runs, which are created automatically)
#   area       which top-level area a section belongs to (default "reference")
#
# `[[section.child]]` adds a nested group. A new section or document that is
# not listed here still appears under "Other", so nothing silently disappears.

[area.guides]
title = "Guides"
description = "Plain-language tours and explanations. Start here if you are new; each guide links to the precise reference document."

[area.reference]
title = "Reference"
description = "The dense source of truth: specifications, decision records, measured reports and the run archive."

[[section]]
id = "overview"
area = "guides"
title = "Overview"
description = "Where the project is and how the documents fit together."
pages = ["docs/README.md", "docs/status.md"]

[[section]]
id = "guides"
area = "guides"
title = "Guides"
description = "Plain-language tours of the engine, the world, the frame and the measurements."
pages = [
  "docs/guides/README.md",
  "docs/guides/architecture-tour.md",
  "docs/guides/worldgen-tour.md",
  "docs/guides/rendering-and-streaming.md",
  "docs/guides/performance-and-measurement.md",
  "docs/guides/glossary.md",
]

[[section]]
id = "specifications"
title = "Specifications"
description = "The normative documents. When they disagree, the spec wins, then the roadmap, then the task list."
pages = [
  "docs/specs/voxel-engine-architecture-spec.md",
  "docs/specs/voxel-engine-roadmap.md",
  "docs/specs/task-list.md",
  "docs/specs/worldgen-design.md",
  "docs/specs/pre-registration.md",
  "docs/specs/reference-machine.md",
  "docs/specs/performance-targets.md",
  "docs/specs/generator.spec.md",
  "docs/specs/water-textures.md",
]

[[section]]
id = "design"
title = "Game design"
description = "Game-level field specifications for the technology tree. No engine rules."
match = ["docs/design/*.md"]

[[section]]
id = "adr"
title = "Architecture Decision Records"
description = "The decisions behind the spec, one page each."
match = ["docs/adr/*.md"]

[[section]]
id = "milestones"
title = "Milestones & gate reports"
description = "Measured evidence for every milestone: what was built, what it cost, and whether it passed."

[[section.child]]
id = "m0"
title = "M0 — baseline"
match = ["docs/milestones/m0/*.md"]

[[section.child]]
id = "m1"
title = "M1 — gate selection"
match = ["docs/milestones/m1/*.md"]

[[section.child]]
id = "m2"
title = "M2 — meshing & light"
pages = [
  "docs/milestones/m2/m2-apron-cost.md",
  "docs/milestones/m2/m2-light-cost.md",
  "docs/milestones/m2/m2-light-20pct.md",
  "docs/milestones/m2/m2-raytest.md",
  "docs/milestones/m2/m2-viewer.md",
  "docs/milestones/m2/profile/README.md",
  "docs/milestones/m2/m2-exit.md",
]

[[section.child]]
id = "m2_5"
title = "M2.5 — worldgen"
match = ["docs/milestones/m2.5/*.md"]

[[section.child]]
id = "m3"
title = "M3 — streaming slice"
pages = [
  "docs/milestones/m3/m3-mesh-compression.md",
  "docs/milestones/m3/m3-packed-8b.md",
  "docs/milestones/m3/m3-01-streaming.md",
  "docs/milestones/m3/m3-02-mesh-pool.md",
  "docs/milestones/m3/m3-03-upload-queue.md",
