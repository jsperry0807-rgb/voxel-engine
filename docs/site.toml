  "docs/milestones/m3/m3-06-instrumentation.md",
  "docs/milestones/m3/m3-07-frame-breakdown.md",
  "docs/milestones/m3/m3-08-stress-scene.md",
  "docs/milestones/m3/m3-09-hitch-test.md",
  "docs/milestones/m3/m3-10-60hz.md",
  "docs/milestones/m3/m3-11-memory.md",
