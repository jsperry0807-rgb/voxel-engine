[[section]]
id = "benchmarks"
title = "Benchmarks"
description = "How runs are recorded, the lens definitions, and the caveats that apply to every number."
pages = [
  "benchmarks/README.md",
  "benchmarks/HISTORY.md",
  "benchmarks/fixtures/README.md",
]

[[section]]
id = "benchmark-runs"
title = "Benchmark runs"
description = "One group per archived run, newest last."
match = ["benchmarks/runs/**/*.md"]
