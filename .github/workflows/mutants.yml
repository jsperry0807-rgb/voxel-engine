name: Mutants

# Mutation testing is intentionally not a per-PR job: it needs to run the test
# suite once per mutant. .cargo/mutants.toml focuses the audit on voxel-core and
# voxel-storage; this workflow splits that focused set across parallel shards.
on:
  schedule:
    # Weekly, off the main CI hours.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  mutants:
    name: mutants ${{ matrix.shard }}/8
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      # Report every shard's misses even when another shard already failed.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mutants
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      # Keep the shard count in sync with the matrix above. A local run can use
      # any shard, e.g. `cargo mutants --shard 3/8`.
      - run: cargo mutants --workspace --shard ${{ matrix.shard }}/8
