name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  constants:
    name: chunk constants
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Fails if chunk geometry is spelled as a literal outside constants.rs.
      - run: ./scripts/check-constants.sh

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # GPU round-trips skip themselves when no adapter is available; the
      # layout and shader tests still run everywhere.
      - run: cargo test --workspace

  textures:
    name: texture pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Regenerates every graph in memory and fails on a one-byte diff.
      - run: cargo run -p voxel-texgen -- check
      - run: cargo test -p voxel-block texture_manifest
      - run: cargo test -p voxel-block materials_gen_is_current

  shaders:
    name: naga shaders
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Parses and validates the WGSL sources with naga; no GPU required.
      - run: cargo test -p voxel-render --test shaders

  chunk128:
    name: chunk128 (128³ edge)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --features chunk128

  windows-cross:
    name: Windows cross-build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y mingw-w64
      # Same preflight a developer gets from `cargo build-win`.
      - run: cargo build-win

  gate:
    name: M1 gate (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The frozen gate cases stay runnable and reporting, but the gate is a
    # milestone decision, not a per-PR merge blocker. The report owns the verdict.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release -p voxel-bench -- gate report
      - run: cargo run --release -p voxel-bench -- gate scaleup
