name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  constants:
    name: chunk constants
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Fails if chunk geometry is spelled as a literal outside constants.rs.
      - run: ./scripts/check-constants.sh

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The optional ray-test occluder is feature-gated, so it needs its own pass.
      - run: cargo clippy -p voxel-mesh --features raytest --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # GPU round-trips skip themselves when no adapter is available; the
      # layout and shader tests still run everywhere.
      - run: cargo test --workspace
      - run: cargo test -p voxel-mesh --features raytest

  goldens:
    name: golden mesh fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # The golden files are the frozen M2-11 mesh contract at both edges.
      - run: cargo test -p voxel-mesh --test golden
      - run: cargo test -p voxel-mesh --features chunk128 --test golden
      # The worldgen goldens are the frozen M2.5-01 noise contract.
      - run: cargo test -p voxel-worldgen noise
      - run: cargo test -p voxel-worldgen macro_generator
      # M2.5-05: the whole macro world hashes to a pinned value. Update the
      # constant here and in the task docs when a field change is intentional.
      - name: Full macro world hash
        run: |
          cargo run -p voxel-worldgen -- macro --seed 1 | tee target/macro-world.txt
          grep -q 'world_hash=5b17f74f2bef0481' target/macro-world.txt
      - name: Checksum the frozen goldens
        run: sha256sum crates/engine/mesh/tests/golden/*.txt > target/golden-sha256.txt
      - name: Upload the frozen goldens
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        with:
          name: mesh-goldens
          if-no-files-found: error
          retention-days: 90
          path: |
            crates/engine/mesh/tests/golden/
            target/golden-sha256.txt

  textures:
    name: texture pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # Regenerates every graph in memory and fails on a one-byte diff.
      - run: cargo run -p voxel-texgen -- check
      - run: cargo test -p voxel-block texture_manifest
      - run: cargo test -p voxel-block materials_gen_is_current

  shaders:
    name: naga shaders
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # Parses and validates the WGSL sources with naga; no GPU required.
      - run: cargo test -p voxel-render --test shaders

  viewer-validation:
    name: viewer validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # Lavapipe supplies a real Vulkan adapter for the offscreen chunk draw.
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: Chunk shader and pipeline validation
        env:
          RUST_LOG: wgpu_core=warn
          WGPU_BACKEND: vulkan
          VOXEL_REQUIRE_GPU: "1"
        run: cargo test -p voxel-viewer --test validation

  chunk128:
    name: chunk128 (128³ edge)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test --workspace --features chunk128

  windows-cross:
    name: Windows cross-build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: sudo apt-get update && sudo apt-get install -y mingw-w64
      # Same preflight a developer gets from `cargo build-win`.
      - run: cargo build-win

  gate:
    name: M1 gate (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The frozen gate cases stay runnable and reporting, but the gate is a
    # milestone decision, not a per-PR merge blocker. The report owns the verdict.
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo run --release -p voxel-bench -- gate report
      - run: cargo run --release -p voxel-bench -- gate scaleup
