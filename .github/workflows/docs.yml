name: Docs

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "mkdocs.yml"
      - "scripts/build-docs-site.py"
      - ".github/workflows/docs.yml"
  # Build (but do not publish) on pull requests, so a broken link or an
  # absolute asset path fails before it reaches main. GitHub Actions does not
  # support YAML anchors, hence the repeated list.
  pull_request:
    paths:
      - "**/*.md"
      - "mkdocs.yml"
      - "scripts/build-docs-site.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material~=9.5
      - run: python3 scripts/build-docs-site.py
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    name: deploy
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
